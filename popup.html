<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Jules Task Manager</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <header>
    <div class="header-title-group">
      <h1>Jules Task Manager</h1>
      <span class="version">v2.4</span>
    </div>
    <div class="header-links">
      <span class="author">by <a href="https://www.egodevnull.com/" target="_blank"
          rel="noopener noreferrer">Ego/dev/null</a></span>
      <a href="https://ko-fi.com/egodevnull" target="_blank" rel="noopener noreferrer" class="coffee-link"
        title="Buy me a coffee" aria-label="Buy me a coffee on Ko-fi">
        <svg class="coffee-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
      </a>
    </div>
  </header>

  <section class="options">
    <h2>Options</h2>
    <div class="setting-row">
      <fieldset style="border: none; padding: 0; margin: 0; display: contents;">
        <legend id="opModeLabel">Operation</legend>
        <div class="segmented" id="opMode">
          <button type="button" data-value="archive" class="active" aria-pressed="true">Archive Tasks</button>
          <button type="button" data-value="suggestions" aria-pressed="false">Start Suggestions</button>
          <button type="button" data-value="remove_suggestions" aria-pressed="false">Remove Suggestions</button>
        </div>
      </fieldset>
    </div>
    <div class="setting-row">
      <fieldset style="border: none; padding: 0; margin: 0; display: contents;">
        <legend id="execModeLabel">Execution Mode</legend>
        <div class="radio-group">
          <label><input type="radio" name="mode" value="dry" checked /> Dry Run</label>
          <label><input type="radio" name="mode" value="run" /> Run</label>
        </div>
      </fieldset>
    </div>
    <div class="setting-row">
      <label for="repoFilter">
        Repository Filter <span class="hint" id="repoFilterHint">(optional, select codebase)</span>
        <select id="repoFilter" aria-describedby="repoFilterHint">
          <option value="">-- All Repositories --</option>
        </select>
      </label>
    </div>
  </section>



  <button type="button" id="startBtn" class="primary">Start Archiving</button>
  <button type="button" id="resetBtn" class="secondary" style="display: none">Reset</button>

  <section id="progressSection" style="display: none">
    <h2>Progress</h2>
    <div id="currentInfo" class="current-info" aria-live="polite"></div>
    <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
      aria-label="Operation progress">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <pre id="log" class="log" aria-live="off"></pre>
  </section>

  <section id="summarySection" style="display: none">
    <h2>Summary</h2>
    <div id="summary" class="summary" aria-live="polite"></div>
  </section>

  <script src="popup.js"></script>
</body>

</html>
